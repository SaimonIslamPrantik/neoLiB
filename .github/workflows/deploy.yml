name: Deploy neoLiB to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble site and inject GitHub Secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          mkdir -p _site
          cp index.html console.html _site/
          touch _site/.nojekyll
          node -e '
            const fs = require("fs");
            const cfg = {
              SUPABASE_URL: (process.env.SUPABASE_URL || "").trim(),
              SUPABASE_ANON_KEY: (process.env.SUPABASE_ANON_KEY || "").trim()
            };
            const replacement = `<script id="neolib-env">window.NEOLIB_ENV = ${JSON.stringify(cfg)};<\/script>`;
            for (const file of ["_site/index.html", "_site/console.html"]) {
              let html = fs.readFileSync(file, "utf8");
              html = html.replace(/<script id="neolib-env">[\s\S]*?<\/script>/, () => replacement);
              fs.writeFileSync(file, html);
            }
          '

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
